<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Deep Sea Word Puzzle - Dolphin Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <style>
    body { margin: 0; padding: 0; background-color: #05131d; overflow: hidden; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    #game-wrap { position: relative; width: 100%; max-width: 480px; height: 100vh; max-height: 800px; }
    #game-container { width: 100%; height: 100%; }

    #name-overlay {
      position: absolute; inset: 0; z-index: 10;
      background: radial-gradient(circle at 50% 30%, #123847 0%, #05131d 75%);
      display: flex; align-items: center; justify-content: center;
      font-family: sans-serif; color: #e0f7fa;
    }
    #name-overlay .name-card { width: 82%; max-width: 320px; text-align: center; }
    #name-overlay h1 { font-size: 20px; margin: 0 0 6px; color: #ffe600; text-shadow: 0 0 8px rgba(0,255,255,0.5); }
    #name-overlay p { font-size: 14px; margin: 0 0 16px; color: #b7e6ee; }
    #name-input {
      width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 16px;
      border-radius: 8px; border: 2px solid #00ffff; background: #0a2e38; color: #ffffff;
      text-align: center; outline: none;
    }
    #name-input::placeholder { color: #6fa8b5; }
    #start-btn {
      width: 100%; margin-top: 12px; padding: 12px; font-size: 16px; font-weight: bold;
      border-radius: 10px; border: 2px solid #ffffff; background: #27ae60; color: #ffffff;
      cursor: pointer;
    }
    #start-btn:disabled { opacity: 0.6; cursor: default; }
    #leaderboard-preview {
      margin-top: 20px; padding: 12px; background: rgba(0,0,0,0.35); border-radius: 10px;
      font-size: 13px; line-height: 1.6; text-align: left; color: #d8f5f8;
    }
    #leaderboard-preview strong { color: #ffd700; }
  </style>
</head>
<body>

<div id="game-wrap">
  <div id="game-container"></div>

  <div id="name-overlay">
    <div class="name-card">
      <h1>🐬 Deep Sea Word Puzzle</h1>
      <p>탐험을 시작할 이름을 입력하세요</p>
      <input id="name-input" maxlength="10" placeholder="이름 (최대 10자)" autocomplete="off" />
      <button id="start-btn">시작하기</button>
      <div id="leaderboard-preview"></div>
    </div>
  </div>
</div>

<script>
let dictionary = new Set();
const GRID_SIZE = 8;
// 모음 비율을 높이고 Y도 추가 (기존엔 Y가 아예 없었음)
const LETTER_POOL = "AAAAAAAAAABBCCDDDDEEEEEEEEEEEEEFFGGHHHIIIIIIIIIJKLLLLMMNNNNNNOOOOOOOOPPQRRRRRRSSSSSSSTTTTTTTUUUUVWWXYYYZ";

// 타일 종류 <-> 텍스처 매핑
const TILE_TEXTURE = {
  normal: 'tile_normal',
  ice: 'tile_ice',
  lava: 'tile_lava',
  vortex: 'tile_vortex',
  concrete: 'tile_concrete',
  gem: 'tile_gem',
  pearl: 'tile_pearl',
  coral: 'tile_coral',
  bomb: 'tile_bomb'
};

// 방해타일(오답 위험/조작마찰) 레벨별 언락 순서: 아이스 -> 라바 -> 소용돌이 -> 콘크리트
const OBSTACLE_UNLOCK = [
  { level: 2, type: 'ice' },
  { level: 3, type: 'lava' },
  { level: 4, type: 'vortex' },
  { level: 5, type: 'concrete' }
];
const CONCRETE_WEIGHT = 0.5; // 다른 방해타일 대비 콘크리트 가중치 (더 희귀하게)

// 방해타일은 더 이상 확률로 랜덤 등장하지 않고, 5레벨 구간마다 목표 개수를 정해서 부족하면 채워 넣음
// 5~9:4개, 10~14:6개, 15~19:8개 ... 구간마다 +2
const OBSTACLE_TARGET_LEVEL_SPAN = 5;
const OBSTACLE_TARGET_BASE = 4;
const OBSTACLE_TARGET_STEP = 2;
function obstacleTargetForLevel(level) {
  if (level < OBSTACLE_TARGET_LEVEL_SPAN) return 0;
  return OBSTACLE_TARGET_BASE + OBSTACLE_TARGET_STEP * Math.floor((level - OBSTACLE_TARGET_LEVEL_SPAN) / OBSTACLE_TARGET_LEVEL_SPAN);
}

const DANGER_DURATION_MS = { lava: 15000 };
const LAVA_PENALTY_SECONDS = 5;
const LAVA_BONUS_SCORE = 150;
const VORTEX_WANDER_INTERVAL_MS = 10000; // 소용돌이가 몇 초마다 인접 칸으로 이동하는지

// 보너스타일: 레벨과 무관하게 해당 글자수 단어를 만들 때마다 매번 지급 (once-per-game 캡 없음)
const BONUS_MILESTONES = [
  { length: 3, type: 'gem' },
  { length: 4, type: 'pearl' },
  { length: 5, type: 'coral' },
  { length: 6, type: 'bomb' } // 7글자 이상은 보드 완전 리셋(별도 처리, 타일 종류 아님)
];
const GEM_BONUS_SCORE = 200;
const BOMB_BONUS_SCORE = 500;
const CORAL_TIME_BONUS_SECONDS = 6; // 힌트 폐지로 산호 효과를 시간 보너스로 변경

// 레벨업 목표점수 증가폭 배수 (800 -> 900 -> 1050 -> ... 로 완만하게 가속, 레벨 15+ 정체 피드백으로 1.2->1.15 완화)
const LEVEL_BASE_INCREMENT = 800;
const LEVEL_INCREMENT_MULTIPLIER = 1.15;
const LEVEL_CAP = 50;
const BG_TIER_LEVEL_SPAN = 5; // 배경이 몇 레벨마다 바뀌는지
const BG_TIER_COUNT = 10;

// 플레이 로그를 구글 폼으로 전송 (사용자가 폼 생성 후 아래 값을 채워야 실제로 전송됨)
const GOOGLE_FORM_CONFIG = {
  actionUrl: 'https://docs.google.com/forms/u/0/d/e/1FAIpQLScEAsr3h2cjNEqPBmlyDAmaz5Lkz72tTGNXozq-JDQQIJFvgA/formResponse',
  fields: { name: 'entry.1060592687', level: 'entry.1333133042', score: 'entry.2041457480', duration: 'entry.2117525515' }
};

// 단어 통계용 구글 폼 (게임오버 시점에 그 판에서 만든 단어를 단어당 한 줄씩 일괄 전송)
const WORD_FORM_CONFIG = {
  actionUrl: 'https://docs.google.com/forms/u/0/d/e/1FAIpQLSfM6okx1SBeaWbz8rWHXvxf2yebAYHgvtk6YUkWmHVH-w-z2Q/formResponse',
  fields: { name: 'entry.56728062', word: 'entry.1298872198', length: 'entry.151278620', level: 'entry.1947816449', score: 'entry.1261000670' }
};

// 보드가 항상 풀이 가능하도록 보장하는 안전장치용 시드 단어 (쉽고 흔한 단어 위주)
const SEED_WORDS = [
  'CAT','DOG','SUN','SEA','FISH','SHIP','CRAB','WAVE','SAND','ROCK',
  'BLUE','GOLD','STAR','MOON','TREE','LEAF','RAIN','WIND','FIRE','SNOW',
  'BOOK','WORD','GAME','PLAY','JUMP','RUN','WALK','SWIM','DIVE','SHARK',
  'WHALE','CORAL','PEARL','OCEAN','TIDE','REEF','KELP','SHELL','SQUID','EEL'
];

// 오디오
const SFX_VOLUME = 0.4;
const MUTE_STORAGE_KEY = 'bookworm_muted';

// 배경음악: 5곡 중 매 접속마다 무작위로 1곡. 파일당 2~3MB로 커서 preload()엔 넣지 않고
// 보드가 뜬 뒤 별도로 불러옴(초기 로딩 용량에 영향 없게)
const BGM_KEYS = ['bgm_1', 'bgm_2', 'bgm_3', 'bgm_4', 'bgm_5'];
const BGM_VOLUME = 0.25;

// 단어 길이별 "품질" 팝업 (라벨/크기/사운드/연출강도)
const WORD_QUALITY_TIERS = {
  3: { label: 'OK',           fontSize: 22, color: '#e0f7fa', sfx: 'sfx_ok',         sparkle: false, shake: false },
  4: { label: 'Good',         fontSize: 28, color: '#7dffd0', sfx: 'sfx_good',       sparkle: false, shake: false },
  5: { label: 'Great!',       fontSize: 34, color: '#5be8ff', sfx: 'sfx_great',      sparkle: false, shake: false },
  6: { label: 'Excellent!!',  fontSize: 40, color: '#ffd700', sfx: 'sfx_excellent',  sparkle: true,  shake: false },
  7: { label: 'Fantastic!!!', fontSize: 46, color: '#ff9d4d', sfx: 'sfx_fantastic',  sparkle: true,  shake: true }
};

async function loadDictionary() {
  try {
    const response = await fetch('https://raw.githubusercontent.com/david47k/top-english-wordlists/master/top_english_words_lower_50000.txt');
    const text = await response.text();
    text.split('\n').forEach(w => {
      const clean = w.trim().toUpperCase();
      if (clean.length >= 2) dictionary.add(clean);
    });
  } catch (e) {
    ['THE','AND','FOR','ARE','BUT','NOT','YOU','ALL','DIG','SIT','CAT','DOG','DOLPHIN','SEA','OCEAN','FISH','WATER','EEL','SUN','MOON'].forEach(w => dictionary.add(w));
  }
}

// 최고점수 기록 (로컬 저장) 및 플레이어 이름
let PLAYER_NAME = '탐험가';
const HIGH_SCORE_KEY = 'bookworm_highscores';

function loadHighScores() {
  try {
    return JSON.parse(localStorage.getItem(HIGH_SCORE_KEY) || '[]');
  } catch (e) {
    return [];
  }
}

function saveHighScore(name, score) {
  const list = loadHighScores();
  list.push({ name, score });
  list.sort((a, b) => b.score - a.score);
  const top = list.slice(0, 10);
  try {
    localStorage.setItem(HIGH_SCORE_KEY, JSON.stringify(top));
  } catch (e) { /* localStorage 사용 불가 시 순위 저장은 생략 */ }
  return top;
}

// 게임 종료 시 플레이 로그를 구글 폼으로 전송 (개선 참고용). actionUrl이 비어있으면 조용히 건너뜀
function submitPlayLog(name, level, score, sessionStartTime) {
  if (!GOOGLE_FORM_CONFIG.actionUrl) return;

  const durationSeconds = Math.round((Date.now() - sessionStartTime) / 1000);
  const body = new URLSearchParams();
  body.append(GOOGLE_FORM_CONFIG.fields.name, name);
  body.append(GOOGLE_FORM_CONFIG.fields.level, String(level));
  body.append(GOOGLE_FORM_CONFIG.fields.score, String(score));
  body.append(GOOGLE_FORM_CONFIG.fields.duration, String(durationSeconds));

  fetch(GOOGLE_FORM_CONFIG.actionUrl, { method: 'POST', mode: 'no-cors', body })
    .catch(() => { /* 실패해도 게임에는 영향 없음 */ });
}

// 그 판에서 만든 단어들을 단어당 한 줄씩 구글폼으로 일괄 전송 (게임오버 시점에 한 번에 처리)
function submitWordLog(name, wordLog) {
  if (!WORD_FORM_CONFIG.actionUrl) return;

  wordLog.forEach(entry => {
    const body = new URLSearchParams();
    body.append(WORD_FORM_CONFIG.fields.name, name);
    body.append(WORD_FORM_CONFIG.fields.word, entry.word);
    body.append(WORD_FORM_CONFIG.fields.length, String(entry.length));
    body.append(WORD_FORM_CONFIG.fields.level, String(entry.level));
    body.append(WORD_FORM_CONFIG.fields.score, String(entry.score));
    fetch(WORD_FORM_CONFIG.actionUrl, { method: 'POST', mode: 'no-cors', body })
      .catch(() => { /* 실패해도 게임에는 영향 없음 */ });
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderLeaderboardPreview() {
  const list = loadHighScores().slice(0, 5);
  const el = document.getElementById('leaderboard-preview');
  if (list.length === 0) {
    el.innerHTML = '아직 기록이 없습니다.<br>첫 기록의 주인공이 되어보세요!';
    return;
  }
  el.innerHTML = '<strong>🏆 명예의 전당</strong><br>' +
    list.map((e, i) => `${i + 1}. ${escapeHtml(e.name)} — ${e.score}점`).join('<br>');
}

class MainScene extends Phaser.Scene {
  constructor() {
    super({ key: 'MainScene' });
  }

  preload() {
    this.createFallbackTextures();
    this.load.image('dolphin', 'assets/dolphin.png');
    for (const key in TILE_TEXTURE) {
      this.load.image(TILE_TEXTURE[key], `assets/${TILE_TEXTURE[key]}.png`);
    }
    for (let i = 1; i <= BG_TIER_COUNT; i++) {
      this.load.image('bg_sea_' + i, `assets/bg_sea_${i}.jpg`);
    }

    // 사운드
    this.load.audio('sfx_tile_select_1', 'assets/sfx_tile_select_1.mp3');
    this.load.audio('sfx_tile_select_2', 'assets/sfx_tile_select_2.mp3');
    this.load.audio('sfx_tile_select_3', 'assets/sfx_tile_select_3.mp3');
    this.load.audio('sfx_tile_slide', 'assets/sfx_tile_slide.mp3');
    this.load.audio('sfx_tile_land', 'assets/sfx_tile_land.mp3');
    this.load.audio('sfx_ok', 'assets/sfx_ok.mp3');
    this.load.audio('sfx_good', 'assets/sfx_good.mp3');
    this.load.audio('sfx_great', 'assets/sfx_great.mp3');
    this.load.audio('sfx_excellent', 'assets/sfx_excellent.mp3');
    this.load.audio('sfx_fantastic', 'assets/sfx_fantastic.mp3');
  }

  // 로드된 사운드만 안전하게 재생 (파일이 아직 없어도 게임이 죽지 않도록)
  playSfx(key, config) {
    if (this.cache.audio.exists(key)) {
      this.sound.play(key, Object.assign({ volume: SFX_VOLUME }, config));
    }
  }

  // 배경음악 5곡 중 무작위 1곡을 골라 지금 불러와서(preload와 별개) 재생. 게임당 한 번만 시작
  startBackgroundMusic() {
    if (this.bgmStarted) return;
    this.bgmStarted = true;

    const key = BGM_KEYS[Math.floor(Math.random() * BGM_KEYS.length)];
    if (this.cache.audio.exists(key)) {
      this.playBackgroundMusic(key);
      return;
    }
    this.load.audio(key, `assets/${key}.mp3`);
    this.load.once(Phaser.Loader.Events.COMPLETE, () => this.playBackgroundMusic(key));
    this.load.start();
  }

  playBackgroundMusic(key) {
    if (!this.cache.audio.exists(key)) return;
    this.bgmInstance = this.sound.add(key, { loop: true, volume: BGM_VOLUME });
    this.bgmInstance.play();
  }

  createFallbackTextures() {
    let g = this.add.graphics();
    g.fillStyle(0xe6bc8a, 1);
    g.fillRoundedRect(0, 0, 50, 50, 8);
    g.lineStyle(2, 0x5c3a21, 1);
    g.strokeRoundedRect(0, 0, 50, 50, 8);
    g.generateTexture('fallback_tile', 50, 50);
    g.destroy();

    // 타일 마찰 스파크용 작은 원형 텍스처
    let s = this.add.graphics();
    s.fillStyle(0xffe066, 1);
    s.fillCircle(4, 4, 4);
    s.generateTexture('spark_particle', 8, 8);
    s.destroy();
  }

  // 타일이 서로 스치며 미끄러질 때 튀는 작은 불꽃 (1회성 버스트)
  spawnSparks(x, y) {
    const emitter = this.add.particles(x, y, 'spark_particle', {
      speed: { min: 30, max: 90 },
      angle: { min: 0, max: 360 },
      scale: { start: 0.7, end: 0 },
      alpha: { start: 1, end: 0 },
      lifespan: 250,
      quantity: 5,
      tint: [0xfff176, 0xffd700, 0xffffff]
    });
    emitter.explode(5);
    this.time.delayedCall(320, () => emitter.destroy());
  }

  // 타일이 완전히 밀착한 채로 낙하하는 동안 좌우 가장자리에서 계속 스파크가 튀도록 함 (타일을 따라다니는 지속 방출)
  startFrictionSparks(tile, duration) {
    const half = tile.baseSize / 2;
    const emitter = this.add.particles(tile.image.x, tile.image.y, 'spark_particle', {
      x: { min: -half, max: half },
      y: 0,
      speed: { min: 15, max: 50 },
      angle: { min: 0, max: 360 },
      scale: { start: 0.5, end: 0 },
      alpha: { start: 1, end: 0 },
      lifespan: 200,
      frequency: 40,
      tint: [0xfff176, 0xffd700, 0xffffff]
    });
    emitter.setDepth(5);
    emitter.startFollow(tile.image);
    this.time.delayedCall(duration, () => {
      emitter.stop();
      this.time.delayedCall(300, () => emitter.destroy());
    });
  }

  // 레벨 10단계마다 더 깊은 바다 배경으로 전환 (1~10 티어)
  setBackgroundTier(tier) {
    tier = Math.max(1, Math.min(BG_TIER_COUNT, tier));
    const key = 'bg_sea_' + tier;
    const hasTexture = this.textures.exists(key) && this.textures.get(key).key !== '__MISSING';

    if (!this.bgImage) {
      if (hasTexture) {
        this.bgImage = this.add.image(240, 400, key).setDisplaySize(480, 800).setDepth(-1);
      } else {
        this.cameras.main.setBackgroundColor('#0b1d28');
      }
      this.bgTier = tier;
      return;
    }

    if (tier === this.bgTier || !hasTexture) return;
    this.bgTier = tier;
    this.tweens.add({
      targets: this.bgImage,
      alpha: 0,
      duration: 250,
      onComplete: () => {
        this.bgImage.setTexture(key);
        this.tweens.add({ targets: this.bgImage, alpha: 1, duration: 250 });
      }
    });
  }

  create() {
    const GAME_WIDTH = 480;

    // 저장된 음소거 상태 복원 (HUD 만들기 전에 읽어야 버튼 아이콘이 처음부터 맞게 뜸)
    try { this.sound.mute = localStorage.getItem(MUTE_STORAGE_KEY) === '1'; } catch (e) { /* localStorage 사용 불가 시 무시 */ }

    // 배경음악은 초기 로딩과 무관하게 보드가 뜬 뒤 비동기로 불러와 재생 (음소거 버튼과 자동 연동)
    this.startBackgroundMusic();

    // 1. 배경 (레벨 5단계마다 더 깊은 바다로)
    this.bgTier = 0;
    this.bgImage = null;
    this.setBackgroundTier(1);

    // 2. 상단 HUD (SCORE/LV, 제한시간 바, 다음 레벨까지 진행도 바 3단 구성). 오른쪽에 음소거 버튼 공간 확보 위해 폭을 살짝 줄임
    let hudBg = this.add.graphics();
    hudBg.fillStyle(0x000000, 0.5);
    hudBg.fillRoundedRect(15, 10, GAME_WIDTH - 55, 72, 10);

    this.scoreText = this.add.text(30, 20, 'SCORE: 0', {
      font: 'bold 18px sans-serif', fill: '#ffffff', stroke: '#000000', strokeThickness: 3
    });
    this.levelText = this.add.text(GAME_WIDTH - 55, 20, 'LV: 1', {
      font: 'bold 18px sans-serif', fill: '#ffd700', stroke: '#000000', strokeThickness: 3
    }).setOrigin(1, 0);

    this.createMuteButton(GAME_WIDTH);
    this.createRulesButton(GAME_WIDTH);

    // 3. 타이머 바
    this.timerBarBg = this.add.graphics();
    this.timerBarBg.fillStyle(0x222222, 0.8);
    this.timerBarBg.fillRoundedRect(30, 45, GAME_WIDTH - 85, 8, 4);

    this.timerBar = this.add.graphics();
    this.maxTime = 180;
    this.timeLeft = this.maxTime;

    // 3-1. 다음 레벨까지 남은 점수 진행도 바
    this.levelProgressBarBg = this.add.graphics();
    this.levelProgressBarBg.fillStyle(0x222222, 0.8);
    this.levelProgressBarBg.fillRoundedRect(30, 60, GAME_WIDTH - 85, 6, 3);

    this.levelProgressBar = this.add.graphics();

    // 4. 돌고래 캐릭터 (말풍선 공간 확보를 위해 왼쪽으로 배치)
    if (this.textures.exists('dolphin') && this.textures.get('dolphin').key !== '__MISSING') {
      this.dolphin = this.add.image(100, 140, 'dolphin').setDisplaySize(236, 236);
      this.tweens.add({
        targets: this.dolphin,
        y: 146,
        duration: 1500,
        yoyo: true,
        repeat: -1,
        ease: 'Sine.easeInOut'
      });
    }

    // 5. 단어 표시 박스
    let wordBg = this.add.graphics();
    wordBg.fillStyle(0x000000, 0.6);
    wordBg.fillRoundedRect(GAME_WIDTH / 2 - 110, 215, 220, 38, 8);

    this.wordText = this.add.text(GAME_WIDTH / 2, 234, '-', {
      font: 'bold 26px sans-serif', fill: '#ffe600', stroke: '#000000', strokeThickness: 2
    }).setOrigin(0.5);

    this.selectedPath = [];
    this.score = 0;
    this.level = 1;
    this.levelIncrement = LEVEL_BASE_INCREMENT;
    this.targetScore = LEVEL_BASE_INCREMENT;
    this.isPaused = false;
    this.isGameOver = false;
    this.isBoardBusy = false;
    this.dangerTiles = [];
    this.iceTiles = [];
    this.wanderingVortexTiles = [];
    this.wordBubbleRequestId = 0;
    this.wordBubbleHideTimer = null;
    this.slideSoundInstance = null;
    this.sessionStartTime = Date.now();
    this.sessionWordLog = [];

    // 6. 보드 및 하단 컨트롤
    this.createBoard(GAME_WIDTH);
    this.ensureSolvable();
    this.ensureObstacleDensity();
    this.createControls(GAME_WIDTH);
    this.createWordBubble();

    // 7. 해양 테마 통합 팝업 UI
    this.createPopupUI(GAME_WIDTH);
    this.createRulesPopup(GAME_WIDTH);

    // 8. 타이머 이벤트
    this.time.addEvent({
      delay: 100,
      callback: () => this.onTimerTick(GAME_WIDTH),
      loop: true
    });

    this.updateTimerBar(GAME_WIDTH);
    this.updateLevelProgressBar(GAME_WIDTH);
  }

  createPopupUI(gameWidth) {
    this.popupContainer = this.add.container(0, 0).setDepth(100).setVisible(false);

    let overlay = this.add.graphics();
    overlay.fillStyle(0x05131d, 0.85);
    overlay.fillRect(0, 0, gameWidth, 800);
    this.popupContainer.add(overlay);

    let card = this.add.graphics();
    card.fillStyle(0x0a2e38, 0.95);
    card.fillRoundedRect(gameWidth / 2 - 170, 200, 340, 420, 16);
    card.lineStyle(3, 0x00ffff, 0.8);
    card.strokeRoundedRect(gameWidth / 2 - 170, 200, 340, 420, 16);
    this.popupContainer.add(card);

    this.popupTitle = this.add.text(gameWidth / 2, 240, 'LEVEL UP!', {
      font: 'bold 28px sans-serif', fill: '#00ffff', stroke: '#000000', strokeThickness: 3
    }).setOrigin(0.5);
    this.popupContainer.add(this.popupTitle);

    // 게임오버 시 리더보드까지 표시해야 해서 내용 길이가 가변적 -> 위쪽 기준으로 늘어나도록 origin(0.5, 0)
    this.popupDesc = this.add.text(gameWidth / 2, 290, '', {
      font: '16px sans-serif', fill: '#e0f7fa', align: 'center', lineSpacing: 8
    }).setOrigin(0.5, 0);
    this.popupContainer.add(this.popupDesc);

    let popupBtn = this.add.container(gameWidth / 2, 570);

    let btnBg = this.add.graphics();
    btnBg.fillStyle(0x00b894, 1);
    btnBg.fillRoundedRect(-80, -22, 160, 44, 10);
    btnBg.lineStyle(2, 0xffffff, 0.9);
    btnBg.strokeRoundedRect(-80, -22, 160, 44, 10);
    popupBtn.add(btnBg);

    this.popupBtnText = this.add.text(0, 0, '확인', {
      font: 'bold 18px sans-serif', fill: '#ffffff'
    }).setOrigin(0.5);
    popupBtn.add(this.popupBtnText);

    let btnZone = this.add.zone(0, 0, 160, 44).setInteractive();
    popupBtn.add(btnZone);

    btnZone.on('pointerdown', () => {
      this.tweens.killTweensOf(popupBtn);
      this.tweens.add({
        targets: popupBtn,
        scaleX: 0.9,
        scaleY: 0.9,
        duration: 60,
        yoyo: true,
        ease: 'Sine.easeOut'
      });
      if (this.isGameOver) {
        this.restartGame();
      } else {
        this.popupContainer.setVisible(false);
        this.isPaused = false;
      }
    });
    this.popupContainer.add(popupBtn);
  }

  // 레벨업은 더 이상 팝업으로 막지 않고, 화면 중앙에 큰 글자가 1초간 반짝였다 사라짐 (게임은 끊기지 않고 계속 진행)
  showLevelUpPopup(newLevel) {
    this.timeLeft = this.maxTime;
    this.updateTimerBar(480);
    this.setBackgroundTier(Math.min(BG_TIER_COUNT, Math.floor((newLevel - 1) / BG_TIER_LEVEL_SPAN) + 1));

    if (this.levelFlashText) { this.tweens.killTweensOf(this.levelFlashText); this.levelFlashText.destroy(); }

    const txt = this.add.text(240, 380, `LEVEL ${newLevel}!`, {
      fontFamily: '"Luckiest Guy"', fontSize: '56px',
      fill: '#00ffff', stroke: '#000000', strokeThickness: 8
    }).setOrigin(0.5).setDepth(70).setScale(0.4).setAlpha(0);
    this.levelFlashText = txt;

    this.tweens.add({
      targets: txt,
      scale: 1,
      alpha: 1,
      duration: 200,
      ease: 'Back.easeOut',
      onComplete: () => {
        this.tweens.add({
          targets: txt,
          alpha: 0,
          duration: 300,
          delay: 500,
          onComplete: () => { txt.destroy(); if (this.levelFlashText === txt) this.levelFlashText = null; }
        });
      }
    });
  }

  showGameOverPopup() {
    this.isPaused = true;
    this.isGameOver = true;

    const topScores = saveHighScore(PLAYER_NAME, this.score);
    const rankLines = topScores.slice(0, 5)
      .map((entry, i) => `${i + 1}. ${entry.name} - ${entry.score}`)
      .join('\n');

    this.popupTitle.setText('GAME OVER').setFill('#ff4d4d');
    this.popupDesc.setText(
      `${PLAYER_NAME}님의 최종 점수: ${this.score}점\n\n🏆 TOP 5\n${rankLines}`
    );
    this.popupBtnText.setText('다시 시작');
    this.popupContainer.setVisible(true);

    submitPlayLog(PLAYER_NAME, this.level, this.score, this.sessionStartTime);
    submitWordLog(PLAYER_NAME, this.sessionWordLog);
  }

  restartGame() {
    this.isGameOver = false;
    this.isPaused = false;
    this.isBoardBusy = false;
    this.score = 0;
    this.level = 1;
    this.levelIncrement = LEVEL_BASE_INCREMENT;
    this.targetScore = LEVEL_BASE_INCREMENT;
    this.timeLeft = this.maxTime;
    this.sessionStartTime = Date.now();
    this.sessionWordLog = [];

    // 낙하 중이었을 수 있는 슬라이드음은 즉시 정지 (페이드 없이)
    if (this.slideSoundInstance) { this.slideSoundInstance.stop(); this.slideSoundInstance = null; }

    // 위험/얼음/소용돌이 타일 추적·뱃지 정리 (rebuildBoard가 전부 normal로 되돌리므로 추적 목록도 비움)
    this.dangerTiles.forEach(d => {
      this.tweens.killTweensOf(d.tile.image);
      if (d.tile.dangerBadge) d.tile.dangerBadge.destroy();
    });
    this.dangerTiles = [];
    this.iceTiles = [];
    this.wanderingVortexTiles = [];

    this.hideWordBubble();

    if (this.levelFlashText) { this.tweens.killTweensOf(this.levelFlashText); this.levelFlashText.destroy(); this.levelFlashText = null; }

    this.scoreText.setText('SCORE: 0');
    this.levelText.setText('LV: 1');

    this.clearSelection();
    this.popupContainer.setVisible(false);
    this.setBackgroundTier(1);
    this.updateLevelProgressBar(480);

    // 보드판 재생성 (혹시 낙하 애니메이션 도중이었다면 정지 후 제자리로 복구)
    this.rebuildBoard();
    this.ensureSolvable();
    this.ensureObstacleDensity();
  }

  rebuildBoard() {
    for (let r = 0; r < GRID_SIZE; r++) {
      for (let c = 0; c < GRID_SIZE; c++) {
        let tileObj = this.board[r][c];
        this.tweens.killTweensOf(tileObj.image);
        this.tweens.killTweensOf(tileObj.text);

        const x = this.boardStartX + c * this.tileSizeWithGap;
        const y = this.boardStartY + r * this.tileSizeWithGap;
        tileObj.image.setPosition(x, y).setDisplaySize(tileObj.baseSize, tileObj.baseSize).setAlpha(1).clearTint().setTexture(this.tileKey);
        tileObj.text.setPosition(x, y).setScale(1).setAlpha(1);

        tileObj.type = 'normal';
        if (tileObj.dangerBadge) { tileObj.dangerBadge.destroy(); tileObj.dangerBadge = null; }

        tileObj.letter = LETTER_POOL[Math.floor(Math.random() * LETTER_POOL.length)];
        tileObj.text.setText(tileObj.letter);
      }
    }
  }

  // 7글자 이상 단어 완성 보상: 보드 전체(방해타일 포함)를 새로 채움. restartGame()과 달리
  // 점수/레벨/제한시간/배경 티어는 그대로 유지 — 재시작이 아니라 인게임 보상 효과
  triggerFullBoardReset() {
    this.dangerTiles.forEach(d => {
      this.tweens.killTweensOf(d.tile.image);
      if (d.tile.dangerBadge) d.tile.dangerBadge.destroy();
    });
    this.dangerTiles = [];
    this.iceTiles = [];
    this.wanderingVortexTiles = [];

    this.rebuildBoard();
    this.ensureSolvable();
    this.ensureObstacleDensity();

    this.cameras.main.shake(220, 0.01);
    this.showFloatingText(240, 200, '💥 보드 완전 리셋!', '#ff9d4d');
  }

  // 정답으로 제출된 타일들을 제거하고, 중력에 의해 위에서 새 타일이 떨어져 채워지도록 함
  // forcedBonusType이 있으면 이번 리필로 새로 생기는 타일 중 하나는 반드시 그 종류로 생성됨 (마일스톤 보상)
  removeAndRefill(tiles, forcedBonusType) {
    this.isBoardBusy = true;

    const removedSet = new Set(tiles);
    // 폭발 등으로 함께 사라지는 위험/소용돌이 타일도 추적 목록/뱃지에서 정리
    this.dangerTiles.filter(d => removedSet.has(d.tile)).forEach(d => {
      this.tweens.killTweensOf(d.tile.image);
      if (d.tile.dangerBadge) d.tile.dangerBadge.destroy();
    });
    this.dangerTiles = this.dangerTiles.filter(d => !removedSet.has(d.tile));
    this.wanderingVortexTiles = this.wanderingVortexTiles.filter(entry => !removedSet.has(entry.tile));

    // 방금 제거되는 타일들 주변 8칸에 얼음이 있으면 깨짐 처리 (얼음은 스스로 선택할 수 없고, 주변이 깨져야 풀림)
    const brokenIce = new Set();
    tiles.forEach(t => {
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const nr = t.r + dr, nc = t.c + dc;
          if (nr < 0 || nr >= GRID_SIZE || nc < 0 || nc >= GRID_SIZE) continue;
          const nt = this.board[nr][nc];
          if (nt && nt.type === 'ice' && !removedSet.has(nt)) brokenIce.add(nt);
        }
      }
    });
    brokenIce.forEach(iceTile => this.breakIceTile(iceTile));

    let popRemaining = tiles.length;
    if (popRemaining === 0) { this.isBoardBusy = false; return; }

    tiles.forEach(tile => {
      this.tweens.killTweensOf(tile.image);
      this.tweens.add({
        targets: [tile.image, tile.text],
        scaleX: 0,
        scaleY: 0,
        alpha: 0,
        duration: 160,
        ease: 'Back.easeIn',
        onComplete: () => {
          tile.image.destroy();
          tile.text.destroy();
          popRemaining--;
          if (popRemaining === 0) this.applyGravity(removedSet, forcedBonusType);
        }
      });
    });
  }

  // 주변 8칸 중 하나가 깨지면 얼음도 함께 풀려서 일반 타일이 됨
  breakIceTile(tile) {
    this.iceTiles = this.iceTiles.filter(t => t !== tile);
    tile.type = 'normal';
    tile.image.setTexture(this.tileKey);
    this.tweens.add({ targets: [tile.image], alpha: 0.4, duration: 80, yoyo: true, repeat: 1 });
  }

  applyGravity(removedSet, forcedBonusType) {
    const newBoard = Array.from({ length: GRID_SIZE }, () => new Array(GRID_SIZE).fill(null));
    const newSlots = []; // 새 타일이 태어날 자리 목록 (열 전체에서 모아서, 그 중 하나를 보너스 타일로 지정)
    this.fallingRemaining = 0;

    for (let c = 0; c < GRID_SIZE; c++) {
      // 이 열에서 살아남은 타일들을 위→아래 순서 그대로 수집
      let survivors = [];
      for (let r = 0; r < GRID_SIZE; r++) {
        const t = this.board[r][c];
        if (!removedSet.has(t)) survivors.push(t);
      }
      const missing = GRID_SIZE - survivors.length;

      // 살아남은 타일들을 아래쪽 행부터 채워 넣고, 필요한 만큼 아래로 슬라이드
      survivors.forEach((tile, i) => {
        const targetRow = missing + i;
        const oldRow = tile.r;
        tile.r = targetRow;
        newBoard[targetRow][c] = tile;

        const newY = this.boardStartY + targetRow * this.tileSizeWithGap;
        if (targetRow !== oldRow) {
          this.fallingRemaining++;
          this.animateTileFall(tile, newY, () => this.onTileLanded());
        }
      });

      // 비어있는 위쪽 칸은 새 타일 자리로 등록 (아래쪽 빈칸일수록 화면과 가까운 곳에서 출발)
      for (let i = 0; i < missing; i++) {
        newSlots.push({ col: c, targetRow: i, spawnStepsFromBoard: missing - i });
      }
    }

    const forcedSlotIndex = (forcedBonusType && newSlots.length > 0)
      ? Math.floor(Math.random() * newSlots.length) : -1;

    newSlots.forEach((slot, idx) => {
      const type = idx === forcedSlotIndex ? forcedBonusType : this.pickTileType(this.level);
      const tile = this.createTileAt(slot.targetRow, slot.col, null, type);
      newBoard[slot.targetRow][slot.col] = tile;

      const spawnY = this.boardStartY - this.tileSizeWithGap * slot.spawnStepsFromBoard;
      tile.image.y = spawnY;
      tile.text.y = spawnY;

      const newY = this.boardStartY + slot.targetRow * this.tileSizeWithGap;
      this.fallingRemaining++;
      this.animateTileFall(tile, newY, () => this.onTileLanded());
    });

    this.board = newBoard;

    if (this.fallingRemaining === 0) {
      this.isBoardBusy = false;
    } else {
      this.startSlideSound();
    }
  }

  // 낙하 배치 전체에 대해 슬라이드음을 딱 1개만 재생 (타일마다 재생하면 4초짜리 클립이 겹쳐 계속 울림)
  startSlideSound() {
    this.stopSlideSound();
    if (this.cache.audio.exists('sfx_tile_slide')) {
      this.slideSoundInstance = this.sound.add('sfx_tile_slide', { volume: SFX_VOLUME, loop: true });
      this.slideSoundInstance.play();
    }
  }

  // 착지 순간에 맞춰 슬라이드음을 짧게 페이드아웃하며 끊음
  stopSlideSound() {
    if (!this.slideSoundInstance) return;
    const snd = this.slideSoundInstance;
    this.slideSoundInstance = null;
    this.tweens.add({
      targets: snd,
      volume: 0,
      duration: 120,
      onComplete: () => snd.stop()
    });
  }

  // 점점 가속이 붙는 낙하 트윈 (거리가 멀수록 오래 걸리되, easeIn으로 갈수록 빨라지는 느낌)
  animateTileFall(tile, targetY, onComplete) {
    const distance = Math.abs(targetY - tile.image.y);
    const duration = Math.min(1300, 280 + distance * 2.2);

    this.startFrictionSparks(tile, duration);

    this.tweens.add({
      targets: [tile.image, tile.text],
      y: targetY,
      duration,
      ease: 'Quad.easeIn',
      onComplete: () => {
        this.playLandingSettle(tile);
        if (onComplete) onComplete();
      }
    });
  }

  // 착지 순간 살짝 눌렸다 튕기는 정착 연출 (미끄러져 들어와 "턱" 걸리는 물리적 느낌)
  playLandingSettle(tile) {
    this.tweens.killTweensOf(tile.image);
    tile.image.setDisplaySize(tile.baseSize, tile.baseSize);
    this.tweens.add({
      targets: [tile.image],
      displaySizeY: tile.baseSize * 0.85,
      duration: 60,
      ease: 'Sine.easeOut',
      onComplete: () => {
        this.tweens.add({
          targets: [tile.image],
          displaySizeY: tile.baseSize,
          duration: 90,
          ease: 'Back.easeOut'
        });
      }
    });
  }

  onTileLanded() {
    this.fallingRemaining--;
    if (this.fallingRemaining <= 0) {
      this.isBoardBusy = false;
      this.ensureSolvable();
      this.ensureObstacleDensity();
      // 마지막 타일이 착지하는 "쿵" 순간: 슬라이드음은 끊고, 화면을 살짝 흔들며 착지음 재생
      this.stopSlideSound();
      this.cameras.main.shake(160, 0.007);
      this.playSfx('sfx_tile_land');
    }
  }

  updateTimerBar(gameWidth) {
    this.timerBar.clear();
    const pct = Math.max(0, this.timeLeft / this.maxTime);
    const barWidth = (gameWidth - 85) * pct;
    const color = pct < 0.3 ? 0xe74c3c : 0x2ecc71;

    this.timerBar.fillStyle(color, 1);
    this.timerBar.fillRoundedRect(30, 45, barWidth, 8, 4);
  }

  // 이번 레벨 구간(targetScore - levelIncrement ~ targetScore) 안에서의 진행률을 표시
  updateLevelProgressBar(gameWidth) {
    this.levelProgressBar.clear();
    const segStart = this.targetScore - this.levelIncrement;
    const pct = this.level >= LEVEL_CAP
      ? 1
      : Math.max(0, Math.min(1, (this.score - segStart) / this.levelIncrement));
    const barWidth = (gameWidth - 85) * pct;

    this.levelProgressBar.fillStyle(0xffd700, 1);
    this.levelProgressBar.fillRoundedRect(30, 60, barWidth, 6, 3);
  }

  onTimerTick(gameWidth) {
    if (this.isGameOver || this.isPaused) return;
    this.timeLeft -= 0.1;
    if (this.timeLeft <= 0) {
      this.timeLeft = 0;
      this.showGameOverPopup();
    }
    this.updateTimerBar(gameWidth);
    this.tickDangerTiles();
    this.tickWanderingVortex();
  }

  // 라바 타일 카운트다운 처리
  tickDangerTiles() {
    if (this.dangerTiles.length === 0) return;
    const expired = [];
    this.dangerTiles.forEach(entry => {
      entry.remaining -= 100;
      if (entry.tile.dangerBadge) {
        entry.tile.dangerBadge.setText(String(Math.max(0, Math.ceil(entry.remaining / 1000))));
      }
      if (entry.remaining <= 0) expired.push(entry);
    });
    expired.forEach(entry => this.resolveDangerExpiry(entry));
  }

  // 위험(라바) 타일 등록: 카운트다운 뱃지 + 은은한 경고 펄스
  registerDangerTile(tile) {
    const duration = DANGER_DURATION_MS[tile.type];
    if (!duration) return;

    const badge = this.add.text(
      tile.image.x + tile.baseSize / 2 - 6, tile.image.y - tile.baseSize / 2 + 4,
      String(Math.ceil(duration / 1000)),
      { font: 'bold 12px sans-serif', fill: '#fff700', stroke: '#000000', strokeThickness: 3 }
    ).setOrigin(1, 0);
    tile.dangerBadge = badge;

    this.dangerTiles.push({ tile, remaining: duration });

    this.tweens.add({
      targets: [tile.image],
      alpha: 0.55,
      duration: 400,
      yoyo: true,
      repeat: -1
    });
  }

  // 라바가 시간 안에 사용되지 못하고 터졌을 때 처리
  resolveDangerExpiry(entry) {
    const tile = entry.tile;
    this.dangerTiles = this.dangerTiles.filter(d => d !== entry);
    this.tweens.killTweensOf(tile.image);
    tile.image.setAlpha(1);
    if (tile.dangerBadge) { tile.dangerBadge.destroy(); tile.dangerBadge = null; }

    this.timeLeft = Math.max(0, this.timeLeft - LAVA_PENALTY_SECONDS);
    this.showFloatingText(tile.image.x, tile.image.y, `-${LAVA_PENALTY_SECONDS}s`, '#ff4d4d');
    this.revertTileToNormal(tile);
  }

  // 위험 타일이 만료된 후 일반 타일로 되돌림
  revertTileToNormal(tile) {
    tile.type = 'normal';
    tile.image.setTexture(this.tileKey);
    tile.letter = LETTER_POOL[Math.floor(Math.random() * LETTER_POOL.length)];
    tile.text.setText(tile.letter);
  }

  // 10레벨마다 호출: 방해/보너스 타일은 그대로 두고, 일반 타일들의 글자만
  // LETTER_POOL의 실제 모음/자음 비율에 맞춰 다시 뽑아 배정 (장시간 플레이로 누적된 글자 편중 보정)
  rebalanceLetterTiles() {
    const normalTiles = [];
    for (let r = 0; r < GRID_SIZE; r++) {
      for (let c = 0; c < GRID_SIZE; c++) {
        const t = this.board[r][c];
        if (t && t.type === 'normal') normalTiles.push(t);
      }
    }
    if (normalTiles.length === 0) return;

    const isVowel = ch => 'AEIOU'.includes(ch);
    const vowelPool = LETTER_POOL.split('').filter(isVowel);
    const consonantPool = LETTER_POOL.split('').filter(ch => !isVowel(ch));
    const targetVowels = Math.round(normalTiles.length * vowelPool.length / LETTER_POOL.length);

    const newLetters = [];
    for (let i = 0; i < targetVowels; i++) newLetters.push(vowelPool[Math.floor(Math.random() * vowelPool.length)]);
    for (let i = targetVowels; i < normalTiles.length; i++) newLetters.push(consonantPool[Math.floor(Math.random() * consonantPool.length)]);
    newLetters.sort(() => Math.random() - 0.5);

    normalTiles.forEach((tile, i) => {
      tile.letter = newLetters[i];
      tile.text.setText(tile.letter);
    });

    this.ensureSolvable();
    this.showFloatingText(240, 200, '🔤 글자 재배치!', '#7dffd0');
  }

  // 소용돌이 등록: 선택 불가 + 은은한 보라색 펄스, 일정 간격마다 인접 칸으로 이동
  registerWanderingVortex(tile) {
    this.wanderingVortexTiles.push({ tile, remaining: VORTEX_WANDER_INTERVAL_MS });
    this.tweens.add({
      targets: [tile.image],
      alpha: 0.6,
      duration: 500,
      yoyo: true,
      repeat: -1
    });
  }

  // 소용돌이 이동 타이머 처리 (만료 없이 무한 반복)
  tickWanderingVortex() {
    if (this.wanderingVortexTiles.length === 0) return;
    this.wanderingVortexTiles.forEach(entry => {
      entry.remaining -= 100;
      if (entry.remaining <= 0) {
        entry.remaining = VORTEX_WANDER_INTERVAL_MS;
        this.moveVortexToNeighbor(entry.tile);
      }
    });
  }

  // 소용돌이가 인접 8칸 중 콘크리트가 아닌 무작위 한 칸과 위치를 맞바꿈
  moveVortexToNeighbor(tile) {
    const candidates = [];
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        const nr = tile.r + dr, nc = tile.c + dc;
        if (nr < 0 || nr >= GRID_SIZE || nc < 0 || nc >= GRID_SIZE) continue;
        const t = this.board[nr][nc];
        if (t && t.type !== 'concrete') candidates.push(t);
      }
    }
    if (candidates.length === 0) return;

    const target = candidates[Math.floor(Math.random() * candidates.length)];
    const tr = tile.r, tc = tile.c;
    const or_ = target.r, oc = target.c;

    // 보드 배열/좌표 값 교환
    this.board[tr][tc] = target;
    this.board[or_][oc] = tile;
    tile.r = or_; tile.c = oc;
    target.r = tr; target.c = tc;

    const tileX = this.boardStartX + oc * this.tileSizeWithGap;
    const tileY = this.boardStartY + or_ * this.tileSizeWithGap;
    const targetX = this.boardStartX + tc * this.tileSizeWithGap;
    const targetY = this.boardStartY + tr * this.tileSizeWithGap;

    this.tweens.add({ targets: [tile.image, tile.text], x: tileX, y: tileY, duration: 300, ease: 'Sine.easeInOut' });
    this.tweens.add({ targets: [target.image, target.text], x: targetX, y: targetY, duration: 300, ease: 'Sine.easeInOut' });
  }

  createBoard(gameWidth) {
    this.board = [];
    this.tileDisplaySize = 56;
    this.tileGap = 0;
    this.tileSizeWithGap = this.tileDisplaySize + this.tileGap;

    const boardTotalWidth = GRID_SIZE * this.tileSizeWithGap - this.tileGap;
    this.boardStartX = (gameWidth - boardTotalWidth) / 2 + (this.tileDisplaySize / 2);
    this.boardStartY = 280;

    this.tileKey = (this.textures.exists('tile_normal') && this.textures.get('tile_normal').key !== '__MISSING')
                    ? 'tile_normal' : 'fallback_tile';

    for (let r = 0; r < GRID_SIZE; r++) {
      let row = [];
      for (let c = 0; c < GRID_SIZE; c++) {
        row.push(this.createTileAt(r, c, null, this.pickTileType(this.level)));
      }
      this.board.push(row);
    }
  }

  // 특정 (r, c) 위치에 새 타일 오브젝트를 생성 (낙하 리필에서도 재사용)
  createTileAt(r, c, letter, type) {
    type = type || 'normal';
    const x = this.boardStartX + c * this.tileSizeWithGap;
    const y = this.boardStartY + r * this.tileSizeWithGap;
    const finalLetter = letter || LETTER_POOL[Math.floor(Math.random() * LETTER_POOL.length)];

    const textureKey = (this.textures.exists(TILE_TEXTURE[type]) && this.textures.get(TILE_TEXTURE[type]).key !== '__MISSING')
                        ? TILE_TEXTURE[type] : this.tileKey;

    let tileImage = this.add.image(x, y, textureKey).setDisplaySize(this.tileDisplaySize, this.tileDisplaySize).setInteractive();
    // 콘크리트는 선택 자체가 불가능해서 글자를 보여주면 오히려 혼란스러우므로 표시하지 않음
    let tileText = this.add.text(x, y, type === 'concrete' ? '' : finalLetter, {
      font: 'bold 28px sans-serif', fill: '#ffcc00', stroke: '#000000', strokeThickness: 5
    }).setOrigin(0.5);

    let tileObj = {
      r, c, letter: finalLetter, image: tileImage, text: tileText, type,
      baseSize: this.tileDisplaySize, dangerBadge: null
    };

    tileImage.on('pointerdown', () => this.handleTileClick(tileObj));

    if (type === 'lava') this.registerDangerTile(tileObj);
    else if (type === 'vortex') this.registerWanderingVortex(tileObj);
    else if (type === 'ice') this.iceTiles.push(tileObj);

    return tileObj;
  }

  // 새로 생기는 타일은 이제 항상 일반 타일 (방해타일은 ensureObstacleDensity()가 레벨 구간별로 직접 주입,
  // 보너스타일은 마일스톤으로 지급되어 applyGravity에서 forcedBonusType으로 별도 처리됨)
  pickTileType(level) {
    return 'normal';
  }

  countTilesOfType(type) {
    let count = 0;
    for (let r = 0; r < GRID_SIZE; r++) {
      for (let c = 0; c < GRID_SIZE; c++) {
        const t = this.board[r] && this.board[r][c];
        if (t && t.type === type) count++;
      }
    }
    return count;
  }

  // 방해타일 총 개수를 이번 레벨의 목표치까지 채움 (5~9:4개, 10~14:6개, 15~19:8개 ... 5레벨마다 +2)
  ensureObstacleDensity() {
    const target = obstacleTargetForLevel(this.level);
    const obstacleTypes = ['ice', 'lava', 'vortex', 'concrete'];
    const current = obstacleTypes.reduce((sum, t) => sum + this.countTilesOfType(t), 0);
    if (current >= target) return;

    const unlocked = OBSTACLE_UNLOCK.filter(o => this.level >= o.level).map(o => o.type);
    if (unlocked.length === 0) return;

    const normalTiles = [];
    for (let r = 0; r < GRID_SIZE; r++) {
      for (let c = 0; c < GRID_SIZE; c++) {
        if (this.board[r][c] && this.board[r][c].type === 'normal') normalTiles.push(this.board[r][c]);
      }
    }
    normalTiles.sort(() => Math.random() - 0.5);

    let needed = target - current;
    for (const tile of normalTiles) {
      if (needed <= 0) break;
      this.convertTileToObstacle(tile, this.pickWeightedObstacleType(unlocked));
      needed--;
    }
  }

  // 언락된 방해타일 종류 중 가중치 기반 랜덤 선택 (콘크리트는 더 희귀하게)
  pickWeightedObstacleType(unlocked) {
    const weights = unlocked.map(t => t === 'concrete' ? CONCRETE_WEIGHT : 1);
    const totalWeight = weights.reduce((a, b) => a + b, 0);
    let roll = Math.random() * totalWeight;
    for (let i = 0; i < unlocked.length; i++) {
      roll -= weights[i];
      if (roll <= 0) return unlocked[i];
    }
    return unlocked[unlocked.length - 1];
  }

  // 일반 타일을 애니메이션 없이 조용히 방해타일로 전환 (텍스처/추적목록 갱신)
  convertTileToObstacle(tile, type) {
    tile.type = type;
    const textureKey = (this.textures.exists(TILE_TEXTURE[type]) && this.textures.get(TILE_TEXTURE[type]).key !== '__MISSING')
                        ? TILE_TEXTURE[type] : this.tileKey;
    tile.image.setTexture(textureKey);
    if (type === 'concrete') tile.text.setText('');

    if (type === 'lava') this.registerDangerTile(tile);
    else if (type === 'vortex') this.registerWanderingVortex(tile);
    else if (type === 'ice') this.iceTiles.push(tile);
  }

  createControls(gameWidth) {
    const btnY = 735;
    const btnWidth = 170;
    const btnHeight = 46;
    const spacing = 20;

    const buttons = [
      { label: 'CLEAR', color: 0xc0392b, action: () => this.clearSelection() },
      { label: 'SUBMIT', color: 0x27ae60, action: () => this.submitWord() }
    ];

    const totalWidth = buttons.length * btnWidth + (buttons.length - 1) * spacing;
    const startX = (gameWidth - totalWidth) / 2 + btnWidth / 2;

    buttons.forEach((btn, idx) => {
      const x = startX + idx * (btnWidth + spacing);

      // 버튼 배경/텍스트를 컨테이너 로컬 좌표(0,0 중심)로 그려서 눌림 애니메이션이 자연스럽게 스케일되도록 함
      let bg = this.add.graphics();
      bg.fillStyle(btn.color, 1);
      bg.fillRoundedRect(-btnWidth / 2, -btnHeight / 2, btnWidth, btnHeight, 8);
      bg.lineStyle(2, 0xffffff, 0.8);
      bg.strokeRoundedRect(-btnWidth / 2, -btnHeight / 2, btnWidth, btnHeight, 8);

      let text = this.add.text(0, 0, btn.label, {
        font: 'bold 17px sans-serif', fill: '#ffffff'
      }).setOrigin(0.5);

      let container = this.add.container(x, btnY, [bg, text]);

      let zone = this.add.zone(0, 0, btnWidth, btnHeight).setInteractive();
      container.add(zone);

      zone.on('pointerdown', () => {
        if (this.isPaused || this.isGameOver || this.isBoardBusy) return;
        this.tweens.killTweensOf(container);
        this.tweens.add({
          targets: container,
          scaleX: 0.88,
          scaleY: 0.88,
          duration: 60,
          yoyo: true,
          ease: 'Sine.easeOut'
        });
        btn.action();
      });
    });
  }

  handleTileClick(tile) {
    if (this.isPaused || this.isGameOver || this.isBoardBusy) return;

    // 콘크리트/얼음/소용돌이: 항상 선택 불가 - 흔들림으로 "안 눌린다"는 피드백만
    if (tile.type === 'concrete' || tile.type === 'ice' || tile.type === 'vortex') {
      this.tweens.killTweensOf(tile.image);
      this.tweens.add({ targets: [tile.image], angle: 6, duration: 50, yoyo: true, repeat: 3 });
      return;
    }

    // 터치 피드백: 위로 살짝 튀어올랐다가 제자리로 (크기 변화 없음)
    this.playSfx('sfx_tile_select_' + (1 + Math.floor(Math.random() * 3)));
    this.tweens.killTweensOf([tile.image, tile.text]);
    this.tweens.add({
      targets: [tile.image, tile.text],
      y: '-=10',
      duration: 90,
      ease: 'Sine.easeOut',
      yoyo: true
    });

    // 단어는 인접한 칸끼리 자유롭게 연결 (8방향, 몇 번이든 꺾을 수 있음)
    const index = this.selectedPath.indexOf(tile);
    if (index !== -1) {
      // 이미 선택된 타일을 다시 클릭하면 그 지점까지 되돌림
      const deselected = this.selectedPath.slice(index + 1);
      this.selectedPath = this.selectedPath.slice(0, index + 1);
      deselected.forEach(t => this.deselectTile(t));
    } else if (this.selectedPath.length === 0) {
      this.selectedPath.push(tile);
      this.selectTile(tile);
    } else {
      const last = this.selectedPath[this.selectedPath.length - 1];
      const dr = Math.abs(tile.r - last.r), dc = Math.abs(tile.c - last.c);
      const isAdjacent = dr <= 1 && dc <= 1;
      if (isAdjacent) {
        this.selectedPath.push(tile);
        this.selectTile(tile);
      } else {
        // 인접하지 않으면 클릭한 타일부터 새로 시작
        this.selectedPath.forEach(t => this.deselectTile(t));
        this.selectedPath = [tile];
        this.selectTile(tile);
      }
    }

    const word = this.selectedPath.map(t => t.letter).join('');
    this.wordText.setText(word || '-');
  }

  // 선택된 타일에 지속적인 하이라이트(틴트 + 테두리 글로우)를 표시
  selectTile(tile) {
    tile.image.setTint(0x5be8ff);
  }

  deselectTile(tile) {
    tile.image.clearTint();
  }

  clearSelection() {
    this.selectedPath.forEach(t => this.deselectTile(t));
    this.selectedPath = [];
    this.wordText.setText('-');
  }

  // 가로/세로/대각선 방향(dr, dc)에 해당하는 모든 줄을 타일 배열로 구성
  getLinesForDirection(dr, dc) {
    const lines = [];
    if (dr === 0) { // 가로
      for (let r = 0; r < GRID_SIZE; r++) lines.push(this.board[r].slice());
    } else if (dc === 0) { // 세로
      for (let c = 0; c < GRID_SIZE; c++) {
        const col = [];
        for (let r = 0; r < GRID_SIZE; r++) col.push(this.board[r][c]);
        lines.push(col);
      }
    } else if (dr === dc) { // "\" 대각선 (r - c 고정)
      for (let k = -(GRID_SIZE - 1); k <= GRID_SIZE - 1; k++) {
        const line = [];
        for (let r = 0; r < GRID_SIZE; r++) {
          const c = r - k;
          if (c >= 0 && c < GRID_SIZE) line.push(this.board[r][c]);
        }
        if (line.length >= 3) lines.push(line);
      }
    } else { // "/" 대각선 (r + c 고정)
      for (let k = 0; k <= 2 * (GRID_SIZE - 1); k++) {
        const line = [];
        for (let r = 0; r < GRID_SIZE; r++) {
          const c = k - r;
          if (c >= 0 && c < GRID_SIZE) line.push(this.board[r][c]);
        }
        if (line.length >= 3) lines.push(line);
      }
    }
    return lines;
  }

  // 가로/세로/대각선 각 줄을 콘크리트 기준으로 끊어서, 3~5글자 연속 구간(정방향/역방향) 중 사전에 있는 단어를 찾음
  // (힌트 UI에는 더 이상 안 쓰이고, 보드가 항상 풀이 가능한지 확인하는 안전장치로만 사용됨)
  findPossibleWord() {
    const directions = [[0, 1], [1, 0], [1, 1], [1, -1]];

    for (const [dr, dc] of directions) {
      const lines = this.getLinesForDirection(dr, dc);

      for (const line of lines) {
        let segment = [];
        const segments = [];
        line.forEach(tile => {
          if (tile.type === 'concrete' || tile.type === 'ice' || tile.type === 'vortex') {
            if (segment.length) segments.push(segment);
            segment = [];
          } else {
            segment.push(tile);
          }
        });
        if (segment.length) segments.push(segment);

        for (const seg of segments) {
          for (let start = 0; start < seg.length; start++) {
            const maxEnd = Math.min(seg.length - 1, start + 4); // 최대 5글자
            for (let end = start + 2; end <= maxEnd; end++) { // 최소 3글자
              const slice = seg.slice(start, end + 1);
              const forward = slice.map(t => t.letter).join('');
              if (dictionary.has(forward)) return slice;
              const backward = slice.map(t => t.letter).reverse().join('');
              if (dictionary.has(backward)) return slice.slice().reverse();
            }
          }
        }
      }
    }
    return null;
  }

  // 보드에 찾을 수 있는 단어가 하나도 없으면 SEED_WORDS 중 하나를 강제로 심어서 항상 풀이 가능하게 함
  ensureSolvable() {
    if (this.findPossibleWord()) return;
    this.injectGuaranteedWord();
  }

  injectGuaranteedWord() {
    // 가로/세로/대각선(양방향) 모두 후보로 포함 - 정확한 시작 위치는 바운드 체크로 걸러냄
    const directions = [[0, 1], [1, 0], [1, 1], [1, -1]];
    const candidates = [];
    for (let r = 0; r < GRID_SIZE; r++) {
      for (let c = 0; c < GRID_SIZE; c++) {
        directions.forEach(([dr, dc]) => candidates.push({ r, c, dr, dc }));
      }
    }
    candidates.sort(() => Math.random() - 0.5);

    const words = SEED_WORDS.slice().sort(() => Math.random() - 0.5);

    for (const start of candidates) {
      for (const word of words) {
        const endR = start.r + start.dr * (word.length - 1);
        const endC = start.c + start.dc * (word.length - 1);
        if (endR < 0 || endR >= GRID_SIZE || endC < 0 || endC >= GRID_SIZE) continue;

        const targetTiles = [];
        let ok = true;
        for (let i = 0; i < word.length; i++) {
          const t = this.board[start.r + start.dr * i][start.c + start.dc * i];
          if (!t || t.type !== 'normal') { ok = false; break; } // 특수 타일은 건드리지 않고 일반 타일만 덮어씀
          targetTiles.push(t);
        }
        if (!ok) continue;

        targetTiles.forEach((t, i) => {
          t.letter = word[i];
          t.text.setText(word[i]);
        });
        return;
      }
    }
    // 모든 자리가 특수타일로 막혀있는 극단적인 경우는 그냥 넘어감 - 다음 리필 때 다시 시도됨
  }

  // 음소거 토글 버튼 (HUD 우측 상단). 상태는 localStorage에 저장돼서 다음 방문 때도 유지됨
  createMuteButton(gameWidth) {
    const x = gameWidth - 20, y = 29;

    let bg = this.add.graphics();
    bg.fillStyle(0x000000, 0.5);
    bg.fillRoundedRect(x - 15, y - 15, 30, 30, 9);
    bg.lineStyle(2, 0xffffff, 0.6);
    bg.strokeRoundedRect(x - 15, y - 15, 30, 30, 9);

    this.muteButtonText = this.add.text(x, y, this.sound.mute ? '🔇' : '🔊', {
      font: '17px sans-serif'
    }).setOrigin(0.5);

    let zone = this.add.zone(x, y, 30, 30).setInteractive();
    zone.on('pointerdown', () => {
      this.sound.mute = !this.sound.mute;
      this.muteButtonText.setText(this.sound.mute ? '🔇' : '🔊');
      try { localStorage.setItem(MUTE_STORAGE_KEY, this.sound.mute ? '1' : '0'); } catch (e) { /* 저장 불가 시 무시 */ }
    });
  }

  // 게임 규칙 버튼 (음소거 버튼 바로 아래). 클릭하면 간단한 규칙 설명 오버레이를 띄움
  createRulesButton(gameWidth) {
    const x = gameWidth - 20, y = 63;

    let bg = this.add.graphics();
    bg.fillStyle(0x000000, 0.5);
    bg.fillRoundedRect(x - 15, y - 15, 30, 30, 9);
    bg.lineStyle(2, 0xffffff, 0.6);
    bg.strokeRoundedRect(x - 15, y - 15, 30, 30, 9);

    this.add.text(x, y, '📖', { font: '16px sans-serif' }).setOrigin(0.5);

    let zone = this.add.zone(x, y, 30, 30).setInteractive();
    zone.on('pointerdown', () => this.showRulesPopup());
  }

  // 규칙 설명 오버레이 (기존 popupContainer와 별개, 표시 중엔 일시정지)
  createRulesPopup(gameWidth) {
    this.rulesContainer = this.add.container(0, 0).setDepth(90).setVisible(false);

    let overlay = this.add.graphics();
    overlay.fillStyle(0x05131d, 0.9);
    overlay.fillRect(0, 0, gameWidth, 800);
    this.rulesContainer.add(overlay);

    let card = this.add.graphics();
    card.fillStyle(0x0a2e38, 0.97);
    card.fillRoundedRect(gameWidth / 2 - 175, 130, 350, 540, 16);
    card.lineStyle(3, 0x00ffff, 0.8);
    card.strokeRoundedRect(gameWidth / 2 - 175, 130, 350, 540, 16);
    this.rulesContainer.add(card);

    this.rulesContainer.add(
      this.add.text(gameWidth / 2, 155, '게임 규칙', {
        font: 'bold 24px sans-serif', fill: '#00ffff', stroke: '#000000', strokeThickness: 3
      }).setOrigin(0.5)
    );

    const rulesText = [
      '· 인접한 칸끼리 자유롭게 이어서(꺾어도 OK) 3글자 이상 단어를 만드세요',
      '',
      '💎 젬 (3글자) - 고정 보너스 점수',
      '🐢 진주 (4글자) - 단어 점수 ×2',
      '🪸 산호 (5글자) - 시간 +6초',
      '💣 폭탄 (6글자) - 주변 3×3 파괴 + 큰 보너스',
      '💥 완전 리셋 (7글자+) - 보드 전체 새로 채움 (방해타일도 초기화)',
      '',
      '🧊 얼음 - 선택 불가, 주변 8칸이 깨지면 풀림',
      '🔥 라바 - 15초 내 못 쓰면 시간 -5초',
      '🌀 소용돌이 - 선택 불가, 10초마다 이동 (폭탄으로만 제거)',
      '🧱 콘크리트 - 선택 불가, 폭탄으로만 제거',
      '',
      '레벨업 시 제한시간이 가득 회복됩니다'
    ].join('\n');

    this.rulesContainer.add(
      this.add.text(gameWidth / 2, 190, rulesText, {
        font: '14px sans-serif', fill: '#e0f7fa', align: 'left', lineSpacing: 6,
        wordWrap: { width: 310 }
      }).setOrigin(0.5, 0)
    );

    let closeBtn = this.add.container(gameWidth / 2, 630);
    let closeBg = this.add.graphics();
    closeBg.fillStyle(0x00b894, 1);
    closeBg.fillRoundedRect(-70, -20, 140, 40, 10);
    closeBg.lineStyle(2, 0xffffff, 0.9);
    closeBg.strokeRoundedRect(-70, -20, 140, 40, 10);
    closeBtn.add(closeBg);
    closeBtn.add(this.add.text(0, 0, '닫기', { font: 'bold 16px sans-serif', fill: '#ffffff' }).setOrigin(0.5));

    let closeZone = this.add.zone(0, 0, 140, 40).setInteractive();
    closeZone.on('pointerdown', () => this.hideRulesPopup());
    closeBtn.add(closeZone);
    this.rulesContainer.add(closeBtn);
  }

  showRulesPopup() {
    if (this.isGameOver || this.isBoardBusy) return;
    this.isPaused = true;
    this.rulesContainer.setVisible(true);
  }

  hideRulesPopup() {
    this.rulesContainer.setVisible(false);
    this.isPaused = false;
  }

  // 돌고래 옆 말풍선 UI (단어 뜻 표시용)
  createWordBubble() {
    this.wordBubbleContainer = this.add.container(0, 0).setDepth(50).setVisible(false).setAlpha(0);

    let bg = this.add.graphics();
    bg.fillStyle(0xffffff, 0.96);
    bg.fillRoundedRect(170, 90, 295, 105, 16);
    bg.fillTriangle(170, 127, 170, 153, 144, 141);
    bg.lineStyle(2, 0x00b894, 1);
    bg.strokeRoundedRect(170, 90, 295, 105, 16);
    this.wordBubbleContainer.add(bg);

    this.wordBubbleTitle = this.add.text(186, 99, '', {
      font: 'bold 19px sans-serif', fill: '#0a2e38'
    }).setOrigin(0, 0);
    this.wordBubbleContainer.add(this.wordBubbleTitle);

    this.wordBubbleDesc = this.add.text(186, 125, '', {
      font: '14px sans-serif', fill: '#2b1708', align: 'left', lineSpacing: 3,
      wordWrap: { width: 264 }
    }).setOrigin(0, 0);
    this.wordBubbleContainer.add(this.wordBubbleDesc);
  }

  // 말풍선 고정 크기를 넘지 않도록 정의문을 적당한 길이로 자름
  truncateDefinition(def) {
    if (!def) return 'No definition found.';
    const MAX_LEN = 120;
    return def.length > MAX_LEN ? def.slice(0, MAX_LEN).trim() + '...' : def;
  }

  // 정답 단어를 영어 사전 API로 조회해 돌고래 말풍선에 표시 (5초 후 자동으로 사라짐)
  showWordMeaning(word) {
    const requestId = ++this.wordBubbleRequestId;
    this.wordBubbleTitle.setText(word);
    this.wordBubbleDesc.setText('...');
    if (this.wordBubbleHideTimer) { this.wordBubbleHideTimer.remove(false); this.wordBubbleHideTimer = null; }
    this.tweens.killTweensOf(this.wordBubbleContainer);
    this.wordBubbleContainer.setVisible(true).setAlpha(1);

    const controller = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    const timeoutId = setTimeout(() => { if (controller) controller.abort(); }, 4000);

    fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word.toLowerCase()}`, controller ? { signal: controller.signal } : undefined)
      .then(res => { if (!res.ok) throw new Error('not found'); return res.json(); })
      .then(data => {
        clearTimeout(timeoutId);
        if (requestId !== this.wordBubbleRequestId) return;
        const def = data[0] && data[0].meanings && data[0].meanings[0] && data[0].meanings[0].definitions[0];
        this.wordBubbleDesc.setText(this.truncateDefinition(def && def.definition));
        this.startBubbleHideTimer();
      })
      .catch(() => {
        clearTimeout(timeoutId);
        if (requestId !== this.wordBubbleRequestId) return;
        this.wordBubbleDesc.setText('No definition found.');
        this.startBubbleHideTimer();
      });
  }

  startBubbleHideTimer() {
    this.wordBubbleHideTimer = this.time.delayedCall(5000, () => {
      this.tweens.add({
        targets: this.wordBubbleContainer,
        alpha: 0,
        duration: 300,
        onComplete: () => this.wordBubbleContainer.setVisible(false)
      });
    });
  }

  hideWordBubble() {
    this.wordBubbleRequestId++;
    if (this.wordBubbleHideTimer) { this.wordBubbleHideTimer.remove(false); this.wordBubbleHideTimer = null; }
    this.tweens.killTweensOf(this.wordBubbleContainer);
    this.wordBubbleContainer.setVisible(false).setAlpha(0);
  }

  showFloatingText(x, y, text, color) {
    let ft = this.add.text(x, y, text, {
      font: 'bold 22px sans-serif', fill: color, stroke: '#000000', strokeThickness: 3
    }).setOrigin(0.5);

    this.tweens.add({
      targets: ft,
      y: y - 40,
      alpha: 0,
      duration: 1200,
      ease: 'Power1',
      onComplete: () => ft.destroy()
    });
  }

  // 단어 길이별 "품질" 팝업 (OK -> Good -> Great! -> Excellent!! -> Fantastic!!!), 뒤로 갈수록 크고 화려해짐
  showWordQualityPopup(word, x, y) {
    const tierKey = Math.min(7, word.length);
    const tier = WORD_QUALITY_TIERS[tierKey];
    if (!tier) return;

    this.playSfx(tier.sfx);

    const txt = this.add.text(x, y, tier.label, {
      fontFamily: '"Luckiest Guy"', fontSize: tier.fontSize + 'px',
      fill: tier.color, stroke: '#000000', strokeThickness: Math.max(4, Math.round(tier.fontSize / 7))
    }).setOrigin(0.5).setScale(0.3).setAlpha(0).setDepth(60);

    this.tweens.add({
      targets: txt,
      scale: 1,
      alpha: 1,
      duration: 220,
      ease: 'Back.easeOut',
      onComplete: () => {
        this.tweens.add({
          targets: txt,
          y: y - 50,
          alpha: 0,
          duration: 700,
          delay: 350,
          ease: 'Power1',
          onComplete: () => txt.destroy()
        });
      }
    });

    if (tier.sparkle) this.spawnSparks(x, y);
    if (tier.shake) this.cameras.main.shake(140, 0.006);
  }

  submitWord() {
    if (this.isPaused || this.isGameOver || this.isBoardBusy) return;

    const word = this.selectedPath.map(t => t.letter).join('');
    if (word.length < 3) return;

    if (dictionary.has(word)) {
      // 1. 선택된 타일들의 특수 효과 집계 (젬/진주/산호/폭탄/라바/소용돌이)
      let flatBonus = 0;
      let scoreMultiplier = 1;
      let coralTimeGrant = 0;
      const bombTiles = [];
      const extinguished = [];

      this.selectedPath.forEach(t => {
        if (t.type === 'gem') flatBonus += GEM_BONUS_SCORE;
        else if (t.type === 'pearl') scoreMultiplier = 2;
        else if (t.type === 'coral') coralTimeGrant += CORAL_TIME_BONUS_SECONDS;
        else if (t.type === 'bomb') { flatBonus += BOMB_BONUS_SCORE; bombTiles.push(t); }
        else if (t.type === 'lava') { flatBonus += LAVA_BONUS_SCORE; extinguished.push(t); }
      });

      const addedScore = (word.length * 100 + flatBonus) * scoreMultiplier;
      this.score += addedScore;
      this.scoreText.setText(`SCORE: ${this.score}`);
      this.sessionWordLog.push({ word, length: word.length, level: this.level, score: addedScore });

      let bonusTime = word.length === 3 ? 2 : (word.length === 4 ? 4 : 7);
      this.timeLeft = Math.min(this.maxTime, this.timeLeft + bonusTime);

      const lastTile = this.selectedPath[this.selectedPath.length - 1];
      this.showFloatingText(lastTile.image.x, lastTile.image.y, `+${addedScore} (${word})`, '#00ffff');
      this.showWordMeaning(word);
      this.showWordQualityPopup(word, 240, 260);

      // 2. 라바/소용돌이를 시간 안에 썼으면 위험 상태 소화 (뱃지/추적목록 정리)
      extinguished.forEach(t => {
        this.tweens.killTweensOf(t.image);
        if (t.dangerBadge) { t.dangerBadge.destroy(); t.dangerBadge = null; }
      });
      if (extinguished.length > 0) {
        const extinguishedSet = new Set(extinguished);
        this.dangerTiles = this.dangerTiles.filter(d => !extinguishedSet.has(d.tile));
      }

      // 3. 산호로 얻은 시간 보너스 (힌트 폐지로 대체된 효과)
      if (coralTimeGrant > 0) {
        this.timeLeft = Math.min(this.maxTime, this.timeLeft + coralTimeGrant);
        this.showFloatingText(lastTile.image.x, lastTile.image.y - 30, `+${coralTimeGrant}s 산호!`, '#7dffb3');
      }

      // 4. 폭탄: 주변 3x3을 함께 파괴 (콘크리트도 부술 수 있는 유일한 수단)
      let blastExtra = [];
      if (bombTiles.length > 0) {
        const already = new Set(this.selectedPath);
        bombTiles.forEach(bomb => {
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              const nr = bomb.r + dr, nc = bomb.c + dc;
              if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE) {
                const t = this.board[nr][nc];
                if (t && !already.has(t) && !blastExtra.includes(t)) blastExtra.push(t);
              }
            }
          }
        });
        this.cameras.main.shake(120, 0.005);
        this.showFloatingText(bombTiles[0].image.x, bombTiles[0].image.y, '💥 폭발!', '#ff9d4d');
      }

      // 5. 3/4/5/6글자 단어를 완성할 때마다 매번 보너스 타일 지급, 7글자 이상은 보드 완전 리셋 (once-per-game 캡 없음)
      let pendingBonusType = null;
      let triggerFullReset = false;
      if (word.length >= 7) triggerFullReset = true;
      else if (word.length === 6) pendingBonusType = 'bomb';
      else if (word.length === 5) pendingBonusType = 'coral';
      else if (word.length === 4) pendingBonusType = 'pearl';
      else if (word.length === 3) pendingBonusType = 'gem';
      if (pendingBonusType) {
        this.showFloatingText(240, 200, '✨ 보너스 타일 획득!', '#ffe600');
      }

      // 6. 레벨업 판정 (한 단어로 여러 레벨을 넘을 수도 있으므로 while로 처리, 팝업은 최종 레벨로 1회만)
      const levelBeforeUp = this.level;
      let leveledUp = false;
      while (this.level < LEVEL_CAP && this.score >= this.targetScore) {
        this.level++;
        this.levelIncrement = Math.round(this.levelIncrement * LEVEL_INCREMENT_MULTIPLIER / 50) * 50;
        this.targetScore += this.levelIncrement;
        leveledUp = true;
      }
      if (leveledUp) {
        this.levelText.setText(`LV: ${this.level}`);
        this.showLevelUpPopup(this.level);
        // 10/20/30/40 레벨 경계를 넘을 때마다 일반 타일 자음/모음 비율을 다시 맞춤
        if (Math.floor(this.level / 10) > Math.floor(levelBeforeUp / 10)) {
          this.rebalanceLetterTiles();
        }
      }
      this.updateLevelProgressBar(480);

      const matchedTiles = this.selectedPath.concat(blastExtra);
      this.selectedPath = [];
      this.wordText.setText('-');
      if (triggerFullReset) {
        this.triggerFullBoardReset();
      } else {
        this.removeAndRefill(matchedTiles, pendingBonusType);
      }
    } else {
      this.tweens.add({
        targets: this.wordText,
        x: '+=6',
        duration: 40,
        yoyo: true,
        repeat: 3,
        onComplete: () => this.clearSelection()
      });
    }
  }
}

const config = {
  type: Phaser.AUTO,
  width: 480,
  height: 800,
  parent: 'game-container',
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH
  },
  scene: MainScene
};

// 사전은 이름 입력을 기다리는 동안 미리 불러오기 시작
const dictionaryReady = loadDictionary();
renderLeaderboardPreview();

function beginGame() {
  const input = document.getElementById('name-input');
  const raw = input.value.trim();
  PLAYER_NAME = (raw || '탐험가').slice(0, 10);

  const overlay = document.getElementById('name-overlay');
  const startBtn = document.getElementById('start-btn');
  startBtn.disabled = true;
  startBtn.textContent = '불러오는 중...';

  dictionaryReady.then(() => {
    overlay.style.display = 'none';
    window.game = new Phaser.Game(config);
  });
}

document.getElementById('start-btn').addEventListener('click', beginGame);
document.getElementById('name-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') beginGame();
});
